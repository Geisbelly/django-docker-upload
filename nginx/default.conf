upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # limite de upload (Django tambem valida)
    client_max_body_size 100M;

    # Proxy reverso e so isso: TUDO vai para a aplicacao, inclusive /static/ e
    # /media/. O nginx nao monta nenhum volume — quem le e escreve arquivo e o
    # container da aplicacao.
    location / {
        proxy_pass http://django;
        # $http_host preserva a porta; $host a descarta, e ai o Django compara
        # o header Origin (com porta) contra um host sem porta e reprova o CSRF
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
